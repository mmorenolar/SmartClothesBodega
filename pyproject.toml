[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smartclothes-poo"
version = "1.0.0"
description = "Smart Clothes: control de bodega, órdenes de traslado y mermas con POO, MVC y JSON"
requires-python = ">=3.10"

[project.scripts]
smartclothes = "smartclothes.__main__:main"
smartclothes-demo = "smartclothes.demo:main"

[tool.setuptools.packages.find]
where = ["src"]
